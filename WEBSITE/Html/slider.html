<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>AhmetErenErtas Slider</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        img {
            width: 400px;
            height: auto;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h2>AhmetErenErtas Slider</h2>

    <input type="range" min="1" max="3" value="1" id="slider">

    <br>

    <img id="image" src="foto1.jpg">

    <script>
        const slider = document.getElementById("slider");
        const image = document.getElementById("image");

        slider.addEventListener("input", function () {
            image.src = "foto" + slider.value + ".jpg";
        });
    </script>

</body>
</html>
